# Zero Trust Workload Identity Manager — full SPIRE deployment.
# Wave 1:  OperatorGroup + Subscription (OLM provisions immediately).
# Wave 10: All cluster-scoped CRs — created only after CSV Succeeded.
#          ZeroTrustWorkloadIdentityManager aggregates status from the sub-CRs.
# SkipDryRunOnMissingResource=true: CRDs arrive with the CSV and must not
# block a dry-run before that.
#
# Verified 2026-10-31 on OCP 4.22.20, CSV zero-trust-workload-identity-manager.v1.1.2
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: zero-trust-workload-identity-manager
  namespace: {{ .Values.lab.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  targetNamespaces:
    - {{ .Values.lab.namespace }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-zero-trust-workload-identity-manager
  namespace: {{ .Values.lab.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  channel: stable-v1
  installPlanApproval: Automatic
  name: openshift-zero-trust-workload-identity-manager
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
# High-level orchestrator; aggregates Ready status from the four sub-CRs below.
apiVersion: operator.openshift.io/v1alpha1
kind: ZeroTrustWorkloadIdentityManager
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  clusterName: {{ .Values.spire.clusterName | quote }}
  trustDomain: {{ .Values.spire.trustDomain | quote }}
---
# Deploys the SPIRE Server StatefulSet with SQLite3 datastore.
# jwtIssuer must match SpireOIDCDiscoveryProvider.spec.jwtIssuer and the Route URL.
# persistence.storageClass: "" uses the cluster default StorageClass.
apiVersion: operator.openshift.io/v1alpha1
kind: SpireServer
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  trustDomain: {{ .Values.spire.trustDomain | quote }}
  caKeyType: rsa-2048
  caSubject:
    commonName: "SPIRE Server CA"
    country: "US"
    organization: "Red Hat"
  caValidity: "24h"
  defaultJWTValidity: "5m"
  defaultX509Validity: "1h"
  jwtIssuer: "https://oidc-discovery.{{ .Values.lab.namespace }}.{{ .Values.deployer.domain }}"
  logLevel: info
  logFormat: text
  datastore:
    databaseType: sqlite3
    connectionString: "/run/spire/data/datastore.sqlite3"
    maxOpenConns: 100
    maxIdleConns: 2
  persistence:
    accessMode: ReadWriteOnce
    size: 2Gi
    storageClass: ""
---
# Deploys the SPIRE Agent DaemonSet on every node.
# k8sPSATEnabled: k8s Projected Service Account Token node attestation (OpenShift default).
apiVersion: operator.openshift.io/v1alpha1
kind: SpireAgent
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  logLevel: info
  logFormat: text
  nodeAttestor:
    k8sPSATEnabled: "true"
  workloadAttestors:
    k8sEnabled: "true"
    workloadAttestorsVerification:
      type: auto
---
# Deploys the SPIFFE CSI Driver DaemonSet — mounts SVIDs into pods via volume.
# pluginName: csi.spiffe.io is the standard SPIFFE CSI Driver identifier.
apiVersion: operator.openshift.io/v1alpha1
kind: SpiffeCSIDriver
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  pluginName: csi.spiffe.io
  agentSocketPath: /run/spire/agent-sockets
---
# Deploys the SPIRE OIDC Discovery Provider — issues JWT-SVIDs validated via OIDC.
# managedRoute: true — operator creates the OCP Route automatically.
# jwtIssuer must match SpireServer.spec.jwtIssuer.
apiVersion: operator.openshift.io/v1alpha1
kind: SpireOIDCDiscoveryProvider
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  csiDriverName: csi.spiffe.io
  jwtIssuer: "https://oidc-discovery.{{ .Values.lab.namespace }}.{{ .Values.deployer.domain }}"
  logLevel: info
  logFormat: text
  managedRoute: "true"
  replicaCount: 1
