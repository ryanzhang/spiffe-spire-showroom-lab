# Installs Zero Trust Workload Identity Manager Operator in OwnNamespace mode.
# Wave 1: OperatorGroup + Subscription (OLM provisions these immediately).
# Wave 10: ZeroTrustWorkloadIdentityManager CR — CRD arrives only after the
#           operator's CSV reaches Succeeded; SkipDryRunOnMissingResource=true
#           prevents a dry-run failure while OLM is still installing.
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: zero-trust-workload-identity-manager
  namespace: {{ .Values.lab.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  targetNamespaces:
    - {{ .Values.lab.namespace }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-zero-trust-workload-identity-manager
  namespace: {{ .Values.lab.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  channel: stable-v1
  installPlanApproval: Automatic
  name: openshift-zero-trust-workload-identity-manager
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
# ZeroTrustWorkloadIdentityManager is a Cluster-scoped CR (no namespace).
# It deploys SPIRE Server, Agent, and CSI Driver into .Values.lab.namespace.
# installedCSV: zero-trust-workload-identity-manager.v1.1.2 (verified 2026-10-31)
apiVersion: operator.openshift.io/v1alpha1
kind: ZeroTrustWorkloadIdentityManager
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  clusterName: {{ .Values.spire.clusterName | quote }}
  trustDomain: {{ .Values.spire.trustDomain | quote }}
