# Zero Trust Workload Identity Manager — full SPIRE deployment.
# Wave 1:  OperatorGroup + Subscription (OLM provisions immediately).
# Wave 10: All cluster-scoped CRs — created only after CSV Succeeded.
#          ZeroTrustWorkloadIdentityManager aggregates status from the sub-CRs.
#          Sub-CRs (SpireServer/Agent/CSI/OIDC) are created alongside it;
#          the operator deploys the actual pods when it sees each sub-CR.
# SkipDryRunOnMissingResource=true on every wave-10+ resource: the CRDs
# arrive with the CSV and must not block a dry-run before that.
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata:
  name: zero-trust-workload-identity-manager
  namespace: {{ .Values.lab.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  targetNamespaces:
    - {{ .Values.lab.namespace }}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: openshift-zero-trust-workload-identity-manager
  namespace: {{ .Values.lab.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  channel: stable-v1
  installPlanApproval: Automatic
  name: openshift-zero-trust-workload-identity-manager
  source: redhat-operators
  sourceNamespace: openshift-marketplace
---
# High-level orchestrator; aggregates Ready status from the four sub-CRs below.
# installedCSV: zero-trust-workload-identity-manager.v1.1.2 (verified 2026-10-31)
apiVersion: operator.openshift.io/v1alpha1
kind: ZeroTrustWorkloadIdentityManager
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  clusterName: {{ .Values.spire.clusterName | quote }}
  trustDomain: {{ .Values.spire.trustDomain | quote }}
---
# Deploys the SPIRE Server StatefulSet.
# trustDomain must match ZeroTrustWorkloadIdentityManager.spec.trustDomain.
apiVersion: operator.openshift.io/v1alpha1
kind: SpireServer
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  trustDomain: {{ .Values.spire.trustDomain | quote }}
  caKeyType: rsa-2048
  caSubject:
    name: {{ .Values.spire.trustDomain | quote }}
  bundleEndpointProfile: https_web
---
# Deploys the SPIRE Agent DaemonSet on every node.
# k8sPSATEnabled uses Projected Service Account Tokens for node attestation.
apiVersion: operator.openshift.io/v1alpha1
kind: SpireAgent
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  logLevel: info
  logFormat: text
  nodeAttestor:
    k8sPSATEnabled: "true"
  workloadAttestors:
    k8sEnabled: "true"
    workloadAttestorsVerification:
      type: auto
---
# Deploys the SPIFFE CSI Driver DaemonSet — mounts SVIDs into pods via volume.
apiVersion: operator.openshift.io/v1alpha1
kind: SpiffeCSIDriver
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  pluginName: csi.spiffe.io
  agentSocketPath: /run/spire/agent-sockets
---
# Deploys the SPIRE OIDC Discovery Provider — issues JWT-SVIDs validated via OIDC.
# managedRoute: true — operator creates the OCP Route automatically.
# jwtIssuer must match the Route URL; constructed from deployer.domain.
# UNVERIFIED: confirm Route hostname after first sync.
apiVersion: operator.openshift.io/v1alpha1
kind: SpireOIDCDiscoveryProvider
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "10"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  csiDriverName: csi.spiffe.io
  jwtIssuer: "https://oidc-discovery.{{ .Values.lab.namespace }}.{{ .Values.deployer.domain }}"
  logLevel: info
  logFormat: text
  managedRoute: "true"
  replicaCount: 1
