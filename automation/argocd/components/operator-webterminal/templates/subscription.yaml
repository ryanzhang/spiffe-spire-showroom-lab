# Web Terminal Operator — AllNamespaces mode only; installed in openshift-operators
# which already carries a global OperatorGroup from the OpenShift install.
# Participants use the Web Terminal from the OpenShift Console to run oc commands.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata:
  name: web-terminal
  namespace: openshift-operators
spec:
  channel: fast
  installPlanApproval: Automatic
  name: web-terminal
  source: redhat-operators
  sourceNamespace: openshift-marketplace
