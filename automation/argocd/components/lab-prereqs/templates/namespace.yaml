apiVersion: v1
kind: Namespace
metadata:
  name: {{ required "lab.namespace is required" .Values.lab.namespace }}
  labels:
    demo.redhat.com/application: field-content
    # The OpenShift GitOps operator grants this Argo CD instance admin here; no cluster-wide grant needed.
    argocd.argoproj.io/managed-by: {{ .Values.argocdNamespace }}
    # Ownership: make bootstrap refuses an existing namespace without this lab's label.
    app.kubernetes.io/part-of: {{ .Values.partOf }}
