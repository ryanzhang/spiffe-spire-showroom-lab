apiVersion: v1
kind: Namespace
metadata:
  name: {{ required "lab.namespace is required" .Values.lab.namespace }}
  labels:
    demo.redhat.com/application: field-content
    # The OpenShift GitOps operator grants this Argo CD instance admin here; no cluster-wide grant needed.
    argocd.argoproj.io/managed-by: {{ .Values.argocdNamespace }}
    # Ownership: make bootstrap refuses an existing namespace without this lab's label.
    app.kubernetes.io/part-of: {{ .Values.partOf }}
---
# The Showroom terminal runs as the showroom ServiceAccount, and anyone with the
# Showroom URL can use it. Grant read on what the exercises inspect and write only
# on what they change, never ClusterRole edit, which could let a participant
# bypass the control the lab teaches.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: showroom-terminal
  namespace: {{ .Values.lab.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "events"]
    verbs: ["get", "list", "watch"]
  # CHANGE-ME: add exactly the resources and verbs the exercises change, for example
  # pods/exec (create, get) only if a step runs `oc exec`. Delete this Role and its
  # RoleBinding when showroom.terminal is false.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: showroom-terminal
  namespace: {{ .Values.lab.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: showroom-terminal
subjects:
  - kind: ServiceAccount
    name: showroom
    namespace: {{ .Values.showroom.namespace }}
